# Night Owl for GitLab CI. Include it from your .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/finepointcgi/Night-Owl/main/ci/gitlab/nightowl.gitlab-ci.yml
#
# Results show in the merge request widget and diff (code quality report), the job summary
# artifact (nightowl.md), and SARIF for other tools. On merge requests only new findings fail
# the job. Engines run as containers, so the job uses Docker-in-Docker.

variables:
  NIGHTOWL_FAIL_ON: ""  # empty: use .nightowl/policy.yml (default high if there is none)
  NIGHTOWL_PATH: "."
  NIGHTOWL_ARGS: ""
  NIGHTOWL_REPO: finepointcgi/Night-Owl

nightowl:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GIT_DEPTH: 0
    NIGHTOWL_HOME: $CI_PROJECT_DIR/.nightowl-home
  before_script:
    - apk add --no-cache curl git bash gcompat libstdc++ icu-libs >/dev/null
    - NIGHTOWL_INSTALL_DIR=/usr/local/bin sh -c "$(curl -fsSL https://raw.githubusercontent.com/$NIGHTOWL_REPO/main/scripts/install.sh)"
  script:
    - |
      since=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        since="--since $CI_MERGE_REQUEST_DIFF_BASE_SHA --history $CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
      fi
      failflag=""
      if [ -n "$NIGHTOWL_FAIL_ON" ]; then failflag="--fail-on $NIGHTOWL_FAIL_ON"; fi
      nightowl scan "$NIGHTOWL_PATH" --container $failflag $since \
        --sarif-output nightowl.sarif --summary-output nightowl.md --codeclimate-output gl-code-quality.json $NIGHTOWL_ARGS
  artifacts:
    when: always
    paths: [nightowl.sarif, nightowl.md]
    reports:
      codequality: gl-code-quality.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
